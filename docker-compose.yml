version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interviewcoach
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:localdevpassword@postgres:5432/interviewcoach
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/replays:/app/replays

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: