# Local full stack: `docker compose up --build`, then open http://localhost:3000.
# Needs ANTHROPIC_API_KEY in your shell or a root .env file; JUDGE0_API_KEY
# is only needed for the coding track.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interviewcoach
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d interviewcoach"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:localdevpassword@postgres:5432/interviewcoach
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-only-secret-never-use-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
    # Apply migrations, then serve. Seed data once with e.g.
    # `docker compose exec backend python seed_topics.py` (see README).
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - model_cache:/home/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
