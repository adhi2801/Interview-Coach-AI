name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU-only torch, same as the Dockerfile)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  migrations:
    name: Backend · migrations match models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Migrations only need the ORM layer, not the ML stack.
      - run: pip install alembic==1.18.4 SQLAlchemy==2.0.50 psycopg2-binary==2.9.12 python-dotenv==1.2.2
      - name: Upgrade a fresh database to head
        run: alembic upgrade head
      - name: Fail if models.py has changes no migration captures
        run: alembic check

  frontend:
    name: Frontend · lint + unit + build + browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser tests (API and coaching socket mocked)
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
