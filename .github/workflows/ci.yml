name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU-only torch, same as the Dockerfile)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  migrations:
    name: Backend · migrations match models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Migrations only need the ORM layer, not the ML stack.
      - run: pip install alembic==1.18.4 SQLAlchemy==2.0.50 psycopg2-binary==2.9.12 python-dotenv==1.2.2
      - name: Upgrade a fresh database to head
        run: alembic upgrade head
      - name: Fail if models.py has changes no migration captures
        run: alembic check

  frontend:
    name: Frontend · lint + unit + build + browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Browser tests (API and coaching socket mocked)
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Backend · Docker image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t interview-coach-api backend
      - name: Boot against Postgres and answer /health
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
          docker run -d --name api --network ci -p 8000:8000 \
            -e DATABASE_URL=postgresql://postgres:ci@db:5432/ci \
            -e JWT_SECRET_KEY=ci-only-secret-key-for-the-smoke-test \
            -e ANTHROPIC_API_KEY=unused interview-coach-api
          for i in $(seq 1 45); do curl -fsS localhost:8000/health && exit 0; sleep 2; done
          docker logs api
          exit 1
