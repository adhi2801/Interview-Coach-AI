[pytest]
pythonpath = .
testpaths = tests
# These five files are manual smoke-check SCRIPTS, not tests: they have no
# test functions and do all their work at import time — calling the paid
# Claude API (and loading Whisper) during pytest's collection phase. Run
# them directly with `python tests/<file>.py` when you want that check.
addopts =
    --ignore=tests/test_difficulty_levels.py
    --ignore=tests/test_engine.py
    --ignore=tests/test_followup_questions.py
    --ignore=tests/test_multiple_roles.py
    --ignore=tests/test_whisper.py
